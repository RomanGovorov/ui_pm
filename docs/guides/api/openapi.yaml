  # ============================================================
  # EVENTS (SSE) — /api/events
  # ============================================================

  /events:
    get:
      tags:
        - events
      summary: Server-Sent Events (SSE) stream
      description: |
        Opens a persistent SSE connection for real-time updates. Emits events
        for all task and project changes across the system. No authentication required
        (read-only endpoint intended for dashboards).

        **Connection limits:** Max 50 connections overall, max 10 per IP.
        Heartbeat sent every 30 seconds to keep the connection alive.

        **Event types:**
        - `task_created`, `task_updated`, `task_deleted`
        - `project_created`, `project_updated`, `project_deleted`

        **Usage (JavaScript):**
        ```javascript
        const es = new EventSource('http://localhost:3000/api/events');
        es.addEventListener('task_created', (event) => {
          console.log(JSON.parse(event.data));
        });
        ```
      operationId: getSSEStream
      responses:
        "200":
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                type: string
              example: ": heartbeat\n\nevent: task_created\ndata: {\"id\":\"...\",\"title\":\"...\"}\n\n"
        "503":
          description: SSE connection limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: TOO_MANY_CONNECTIONS
                      message:
                        type: string
                        example: SSE connection limit reached

  # ============================================================
  # HEALTH — /api/health
  # ============================================================

  /health:
    get:
      tags:
        - health
      summary: Health check
      description: |
        Returns the health status of the application. Used by Docker healthcheck,
        Kubernetes probes, and external monitoring systems. No authentication required.
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: healthy
                timestamp: "2026-08-13T12:00:00.000Z"
                version: "abc12345"
                checks:
                  database: connected
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unhealthy
                timestamp: "2026-08-13T12:00:00.000Z"
                checks:
                  database: disconnected
                  error: internal_error

